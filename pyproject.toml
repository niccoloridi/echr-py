[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "echr-py"
version = "0.2.0"
description = "Pythonic acquisition of HUDOC and HUDOC-EXEC metadata and source documents for ECtHR research."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "RIGHTS.md"]
authors = [
    { name = "Niccolo Ridi", email = "niccoloridi@gmail.com" },
]
keywords = ["echr", "hudoc", "human rights", "case law", "legal", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Legal Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "aiohttp>=3.14.3",
    "beautifulsoup4>=4.12",
    "lxml>=4.9.2",
    "html2text>=2024.2.26",
    "pydantic>=2.5",
    "pandas>=2.0",
    "pyarrow>=14",
    "tqdm>=4.66",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
llm = ["google-genai>=1.0"]
llm-openai = ["openai>=1.55.3"]
llm-anthropic = ["anthropic>=0.40"]
mcp = ["mcp>=1.29,<2"]
analysis = ["scipy>=1.11.1", "scikit-learn>=1.3", "networkx>=3.2"]
citations = ["pypdf>=6.15"]
research-agent = ["PyYAML>=6", "jsonschema>=4.21"]
embeddings = ["numpy>=1.26"]
embeddings-local = ["echr-py[embeddings]", "sentence-transformers>=3"]
embeddings-faiss = ["echr-py[embeddings]", "faiss-cpu>=1.8"]
exec-docs = ["pymupdf>=1.24", "pymupdf4llm>=0.0.17", "markitdown[docx,pdf]>=0.1"]
ocr = ["mistralai>=1.12"]
scrape = ["playwright>=1.40"]
# Local corpus tools + Streamlit GUI.
convenience = ["openpyxl>=3.1"]
gui = ["streamlit>=1.30"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pillow>=10",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-beautifulsoup4",
    "PyYAML>=6",
    "jsonschema>=4.21",
    "numpy>=1.26",
]
all = ["echr-py[llm,llm-openai,llm-anthropic,mcp,analysis,citations,research-agent,embeddings-local,embeddings-faiss,convenience,gui,exec-docs,ocr,scrape]"]

[project.scripts]
echr-py = "hudoc_py.cli:main"
# Compatibility alias retained for existing shell scripts and integrations.
hudoc-py = "hudoc_py.cli:main"

[project.urls]
Homepage = "https://github.com/niccoloridi/echr-py"
Repository = "https://github.com/niccoloridi/echr-py"
Documentation = "https://github.com/niccoloridi/echr-py#documentation"
Changelog = "https://github.com/niccoloridi/echr-py/blob/main/CHANGELOG.md"
Issues = "https://github.com/niccoloridi/echr-py/issues"

[tool.setuptools.packages.find]
include = ["hudoc_py", "hudoc_py.*"]
exclude = ["tests*", "examples*", "Resources*"]

[tool.setuptools.package-data]
hudoc_py = [
    "data/*.json",
    "data/*.csv",
    "graphs/assets/*.js",
    "graphs/assets/*.txt",
    "studies/schemas/*.json",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = ["live: opt-in network, browser, LLM, or OCR integration test"]

[tool.mypy]
python_version = "3.14"
strict = false
ignore_missing_imports = true
