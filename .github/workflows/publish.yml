name: Publish trusted release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Build-only or trusted-publishing target
        type: choice
        options: [artifact, testpypi, pypi]
        default: artifact
        required: true

permissions:
  contents: read

env:
  # This commit contains the independently audited gate and package manifests.
  # The release commit changes only this workflow to pin that immutable baseline.
  TRUSTED_GATE_REVISION: 1adfa461119c0598dfe8f9551c5c7eb835de399c

jobs:
  source-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[all,dev]"
      - run: ruff check .
      - run: mypy hudoc_py
      - run: pytest -q

  build:
    needs: source-verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Check out the independently pinned release gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: trusted-release-gate-v2
          path: .trusted-release-gate
          persist-credentials: false
          fetch-depth: 1
      - name: Install the checksummed build toolchain
        run: python -m pip install --require-hashes -r release-requirements.txt
      - name: Load the independently pinned release gate
        run: |
          test "$(git -C .trusted-release-gate rev-parse HEAD)" = "$TRUSTED_GATE_REVISION"
          mkdir -p /tmp/echr-release-gate/scripts
          for path in \
            scripts/check_sdist.py \
            scripts/check_wheel.py \
            scripts/public_package_files.txt \
            scripts/public_payload_hashes.json \
            scripts/verify_release.py
          do
            cp ".trusted-release-gate/$path" "/tmp/echr-release-gate/$path"
          done
      - name: Validate a publication ref before building
        env:
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
        run: >-
          python /tmp/echr-release-gate/scripts/verify_release.py
          --event-tag "$RELEASE_EVENT_TAG"
          ${{ (github.event_name == 'release' || inputs.target == 'pypi') && '--require-tag' || '' }}
      - run: python -m build --no-isolation
      - name: Verify artifact versions
        env:
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
        run: >-
          python /tmp/echr-release-gate/scripts/verify_release.py
          --event-tag "$RELEASE_EVENT_TAG"
          ${{ (github.event_name == 'release' || inputs.target == 'pypi') && '--require-tag' || '' }}
          dist/echr_py-*.whl dist/echr_py-*.tar.gz
      - name: Enforce the public boundary in both distributions
        run: |
          python /tmp/echr-release-gate/scripts/check_sdist.py dist/echr_py-*.tar.gz
          python /tmp/echr-release-gate/scripts/check_wheel.py dist/echr_py-*.whl
      - name: Verify wheel in an isolated environment
        run: |
          python -m venv /tmp/hudoc-release-check
          /tmp/hudoc-release-check/bin/python -m pip install dist/echr_py-*.whl
          cd /tmp
          /tmp/hudoc-release-check/bin/python -c \
            "import hudoc_py; from importlib.metadata import version; assert hudoc_py.__version__ == version('echr-py')"
          /tmp/hudoc-release-check/bin/echr-py --version
      - if: github.event.repository.private == false
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/

  publish-pypi:
    if: >-
      github.event.repository.private == false &&
      (github.event_name == 'release' || inputs.target == 'pypi')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/echr-py
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  publish-testpypi:
    if: >-
      github.event.repository.private == false &&
      github.event_name == 'workflow_dispatch' &&
      inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/echr-py
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
